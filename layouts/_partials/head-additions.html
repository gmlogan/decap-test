<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin/";
        });
      }
    });
    // Send invite / password-recovery / confirmation links straight to the
    // CMS admin page, where the widget can complete the flow, instead of
    // stranding the #token fragment on an ordinary content page.
    if (
      document.location.hash &&
      /invite_token=|recovery_token=|confirmation_token=/.test(document.location.hash) &&
      document.location.pathname !== "/admin/"
    ) {
      document.location.href = "/admin/" + document.location.hash;
    }
  }
</script>
