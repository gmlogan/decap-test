media:
  input: static/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, gif, webp, svg]

content:
  - name: posts
    label: Trips
    type: collection
    path: content/posts
    filename: "{fields.date}-{fields.slug}/index.md"
    exclude:
      - _index.md
    view:
      fields: [title, date, thumbnail, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Trip date
        type: date
        options: { format: "yyyy-MM-dd" }
        required: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: lowercase letters, numbers and hyphens only
      - name:
